<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="YR">
  <!-- Pine tile reads on both light and dark browser chrome; lime mark matches the site accent. -->
  <rect width="100" height="100" rx="24" fill="#003434" />
  <text
    x="50"
    y="50"
    fill="#c6f224"
    font-family="Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="-2"
    text-anchor="middle"
    dominant-baseline="central"
  >YR</text>
</svg>
